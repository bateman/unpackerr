name: upstream-sync
# Fork-only: weekly merge of Unpackerr/unpackerr main into this fork.
# Pushes upstream main to the sync/upstream branch, opens (or updates) a PR to main,
# waits for CI, merges it when green and deletes the sync branch.
# Conflicts or red CI leave the PR (and branch) open.
# Needs the UPSTREAM_SYNC_TOKEN secret: a fine-grained PAT for this repo with
# Contents, Pull requests and Workflows set to read/write. The default GITHUB_TOKEN
# cannot push workflow-file changes, and its pushes and PRs do not trigger CI.
on:
  schedule:
    - cron: '17 4 * * 5' # Fridays 04:17 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository != 'Unpackerr/unpackerr'
    name: Sync upstream
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      UPSTREAM: https://github.com/Unpackerr/unpackerr.git
      SYNC_BRANCH: sync/upstream
      BASE_BRANCH: main
    steps:
      - name: Check token
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Add the UPSTREAM_SYNC_TOKEN repository secret (see the header of upstream-sync.yml)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      - name: Push upstream to sync branch
        id: push
        run: |
          set -euo pipefail
          git fetch --no-tags "${UPSTREAM}" main
          sha="$(git rev-parse FETCH_HEAD)"
          if git merge-base --is-ancestor "${sha}" HEAD; then
            echo "Fork already contains upstream ${sha}; nothing to do."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          count="$(git rev-list --count "HEAD..${sha}")"
          echo "Upstream has ${count} new commit(s), up to ${sha}."
          git push --force origin "${sha}:refs/heads/${SYNC_BRANCH}"
          {
            echo "changed=true"
            echo "sha=${sha}"
            echo "short=${sha:0:7}"
            echo "count=${count}"
          } >> "${GITHUB_OUTPUT}"
      - name: Open or update PR
        id: pr
        if: steps.push.outputs.changed == 'true'
        env:
          SHORT: ${{ steps.push.outputs.short }}
          COUNT: ${{ steps.push.outputs.count }}
        run: |
          set -euo pipefail
          title="Merge upstream Unpackerr/unpackerr main (${SHORT})"
          body="Automated weekly sync: ${COUNT} new upstream commit(s) from Unpackerr/unpackerr@main, up to ${SHORT}.
          This PR is merged by the upstream-sync workflow once CI is green. It stays open on conflicts or failing CI."
          pr="$(gh pr list --head "${SYNC_BRANCH}" --base "${BASE_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${pr}" ]; then
            gh pr edit "${pr}" --title "${title}" --body "${body}"
          else
            gh pr create --head "${SYNC_BRANCH}" --base "${BASE_BRANCH}" --title "${title}" --body "${body}"
            pr="$(gh pr list --head "${SYNC_BRANCH}" --base "${BASE_BRANCH}" --state open --json number --jq '.[0].number')"
          fi
          echo "PR #${pr}"
          echo "number=${pr}" >> "${GITHUB_OUTPUT}"
      - name: Wait for mergeability
        if: steps.push.outputs.changed == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            state="$(gh pr view "${PR}" --json mergeable --jq .mergeable)"
            [ "${state}" != UNKNOWN ] && break
            sleep 15
          done
          echo "Mergeable: ${state}"
          if [ "${state}" != MERGEABLE ]; then
            gh pr comment "${PR}" --body "upstream-sync: this PR has merge conflicts (\`${state}\`) and needs a manual merge."
            echo "::error::PR #${PR} is not mergeable (${state}); resolve it manually."
            exit 1
          fi
      - name: Wait for CI
        if: steps.push.outputs.changed == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Give the push-triggered workflows time to register their checks.
          sleep 60
          for _ in $(seq 1 20); do
            gh pr checks "${PR}" --json name --jq 'length' 2>/dev/null | grep -qv '^0$' && break
            sleep 15
          done
          if ! gh pr checks "${PR}" --watch --interval 30; then
            echo "::error::CI failed on PR #${PR}; leaving it open."
            exit 1
          fi
      - name: Merge PR
        if: steps.push.outputs.changed == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.push.outputs.sha }}
          SHORT: ${{ steps.push.outputs.short }}
        run: |
          set -euo pipefail
          gh pr merge "${PR}" --merge --match-head-commit "${SHA}" \
            --subject "Merge upstream Unpackerr/unpackerr main (${SHORT})"
          # Skipped if the repo's "Automatically delete head branches" setting already removed it.
          if git ls-remote --exit-code --heads origin "${SYNC_BRANCH}" > /dev/null; then
            git push origin --delete "${SYNC_BRANCH}"
          fi
